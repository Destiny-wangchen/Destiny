<svg xmlns="http://www.w3.org/2000/svg" width="820" height="392" viewBox="0 0 820 392" role="img" aria-label="按行访问与按列访问的内存顺序对比">
<defs>
<style>
.cell{fill:none;stroke:#141414;stroke-width:1.1}
.hl{fill:#e9e9e9;stroke:none}
.tn{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:15px;fill:#141414}
.tn2{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:17px;fill:#141414}
.ts{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:13px;fill:#141414}
.tm{font-family:Consolas,'Courier New',monospace;font-size:13px;fill:#141414}
.gd{fill:none;stroke:#9a9a9a;stroke-width:1;stroke-dasharray:6 4}
</style>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,1.4 L10,5 L0,8.6 z" fill="#9a9a9a"/>
</marker>
</defs>

<text class="tn2" x="188" y="56" text-anchor="middle">按行访问</text>
<text class="ts" x="188" y="78" text-anchor="middle">访问顺序 = 内存顺序，缓存行全用上</text>

<rect class="hl" x="100" y="110" width="176" height="44"/>
<rect class="cell" x="100" y="110" width="44" height="44"/>
<rect class="cell" x="144" y="110" width="44" height="44"/>
<rect class="cell" x="188" y="110" width="44" height="44"/>
<rect class="cell" x="232" y="110" width="44" height="44"/>
<rect class="cell" x="100" y="154" width="44" height="44"/>
<rect class="cell" x="144" y="154" width="44" height="44"/>
<rect class="cell" x="188" y="154" width="44" height="44"/>
<rect class="cell" x="232" y="154" width="44" height="44"/>
<rect class="cell" x="100" y="198" width="44" height="44"/>
<rect class="cell" x="144" y="198" width="44" height="44"/>
<rect class="cell" x="188" y="198" width="44" height="44"/>
<rect class="cell" x="232" y="198" width="44" height="44"/>
<rect class="cell" x="100" y="242" width="44" height="44"/>
<rect class="cell" x="144" y="242" width="44" height="44"/>
<rect class="cell" x="188" y="242" width="44" height="44"/>
<rect class="cell" x="232" y="242" width="44" height="44"/>

<text class="tn" x="122" y="138" text-anchor="middle">1</text>
<text class="tn" x="166" y="138" text-anchor="middle">2</text>
<text class="tn" x="210" y="138" text-anchor="middle">3</text>
<text class="tn" x="254" y="138" text-anchor="middle">4</text>
<text class="tn" x="122" y="182" text-anchor="middle">5</text>
<text class="tn" x="166" y="182" text-anchor="middle">6</text>
<text class="tn" x="210" y="182" text-anchor="middle">7</text>
<text class="tn" x="254" y="182" text-anchor="middle">8</text>
<text class="tn" x="122" y="226" text-anchor="middle">9</text>
<text class="tn" x="166" y="226" text-anchor="middle">10</text>
<text class="tn" x="210" y="226" text-anchor="middle">11</text>
<text class="tn" x="254" y="226" text-anchor="middle">12</text>
<text class="tn" x="122" y="270" text-anchor="middle">13</text>
<text class="tn" x="166" y="270" text-anchor="middle">14</text>
<text class="tn" x="210" y="270" text-anchor="middle">15</text>
<text class="tn" x="254" y="270" text-anchor="middle">16</text>

<path class="gd" d="M100,102 L100,94 L232,94"/>
<text class="tm" x="100" y="86">64 B = 16 个 int，一次搬进缓存</text>

<text class="tn2" x="588" y="56" text-anchor="middle">按列访问</text>
<text class="ts" x="588" y="78" text-anchor="middle">每步跨一整行，缓存行只用 1/4</text>

<rect class="cell" x="500" y="110" width="44" height="44"/>
<rect class="cell" x="544" y="110" width="44" height="44"/>
<rect class="cell" x="588" y="110" width="44" height="44"/>
<rect class="cell" x="632" y="110" width="44" height="44"/>
<rect class="cell" x="500" y="154" width="44" height="44"/>
<rect class="cell" x="544" y="154" width="44" height="44"/>
<rect class="cell" x="588" y="154" width="44" height="44"/>
<rect class="cell" x="632" y="154" width="44" height="44"/>
<rect class="cell" x="500" y="198" width="44" height="44"/>
<rect class="cell" x="544" y="198" width="44" height="44"/>
<rect class="cell" x="588" y="198" width="44" height="44"/>
<rect class="cell" x="632" y="198" width="44" height="44"/>
<rect class="cell" x="500" y="242" width="44" height="44"/>
<rect class="cell" x="544" y="242" width="44" height="44"/>
<rect class="cell" x="588" y="242" width="44" height="44"/>
<rect class="cell" x="632" y="242" width="44" height="44"/>

<text class="tn" x="522" y="138" text-anchor="middle">1</text>
<text class="tn" x="566" y="138" text-anchor="middle">5</text>
<text class="tn" x="610" y="138" text-anchor="middle">9</text>
<text class="tn" x="654" y="138" text-anchor="middle">13</text>
<text class="tn" x="522" y="182" text-anchor="middle">2</text>
<text class="tn" x="566" y="182" text-anchor="middle">6</text>
<text class="tn" x="610" y="182" text-anchor="middle">10</text>
<text class="tn" x="654" y="182" text-anchor="middle">14</text>
<text class="tn" x="522" y="226" text-anchor="middle">3</text>
<text class="tn" x="566" y="226" text-anchor="middle">7</text>
<text class="tn" x="610" y="226" text-anchor="middle">11</text>
<text class="tn" x="654" y="226" text-anchor="middle">15</text>
<text class="tn" x="522" y="270" text-anchor="middle">4</text>
<text class="tn" x="566" y="270" text-anchor="middle">8</text>
<text class="tn" x="610" y="270" text-anchor="middle">12</text>
<text class="tn" x="654" y="270" text-anchor="middle">16</text>

<line class="gd" x1="522" y1="112" x2="522" y2="284" marker-end="url(#ar2)"/>
<text class="ts" x="500" y="304" text-anchor="middle">1→2→3→4 每次跳一行</text>

<text class="ts" x="60" y="344">数组在内存里是按行排的：a[0][0]…a[0][15] 连续，之后才是 a[1][0]。</text>
<text class="ts" x="60" y="368">按列访问时，一个缓存行搬进来只能用掉一个数，剩下 15 个等不到下次就过期了。</text>
</svg>
