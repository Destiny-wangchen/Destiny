<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="TCP 三次握手时序图">
<defs>
<style>
.ln{fill:none;stroke:#9a9a9a;stroke-width:1;stroke-dasharray:7 5}
.ax{fill:none;stroke:#141414;stroke-width:1.5}
.tn{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:15.5px;fill:#141414}
.ts{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:13px;fill:#141414}
.tm{font-family:Consolas,'Courier New',monospace;font-size:13px;fill:#141414}
</style>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
  <path d="M0,1.4 L10,5 L0,8.6 z" fill="#141414"/>
</marker>
</defs>

<text class="tn" x="150" y="52" text-anchor="middle">客户端</text>
<text class="tn" x="670" y="52" text-anchor="middle">服务端</text>

<line class="ln" x1="150" y1="66" x2="150" y2="300"/>
<line class="ln" x1="670" y1="66" x2="670" y2="300"/>

<line class="ax" x1="150" y1="104" x2="660" y2="104" marker-end="url(#ar3)"/>
<text class="tm" x="410" y="96" text-anchor="middle">SYN  seq = 1000</text>

<line class="ax" x1="670" y1="164" x2="160" y2="164" marker-end="url(#ar3)"/>
<text class="tm" x="410" y="156" text-anchor="middle">SYN + ACK  seq = 5000, ack = 1001</text>

<line class="ax" x1="150" y1="224" x2="660" y2="224" marker-end="url(#ar3)"/>
<text class="tm" x="410" y="216" text-anchor="middle">ACK  ack = 5001</text>

<text class="ts" x="150" y="86" text-anchor="middle">SYN_SENT</text>
<text class="ts" x="670" y="186" text-anchor="middle">SYN_RCVD</text>
<text class="ts" x="150" y="244" text-anchor="middle">ESTABLISHED</text>
<text class="ts" x="670" y="244" text-anchor="middle">ESTABLISHED</text>

<text class="ts" x="60" y="278">每个报文都带序号与确认号：</text>
<text class="ts" x="60" y="300">序号负责去重与排序，确认号告诉对方「下一个我要第几个字节」。</text>
<text class="ts" x="60" y="330">第三次 ACK 不能省：它让双方确认「这条连接确实是我要的」，而不是滞留的旧 SYN 造成的误会。</text>
</svg>
