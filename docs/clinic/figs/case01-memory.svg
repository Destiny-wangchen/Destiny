<svg xmlns="http://www.w3.org/2000/svg" width="820" height="352" viewBox="0 0 820 352" role="img" aria-label="C 程序内存分区示意：代码段、数据段、BSS、堆与栈">
<defs>
<style>
.bx{fill:none;stroke:#141414;stroke-width:1.6}
.ax{fill:none;stroke:#141414;stroke-width:1.2}
.gd{fill:none;stroke:#9a9a9a;stroke-width:1;stroke-dasharray:6 4}
.tn{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:15.5px;fill:#141414}
.ts{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:12.8px;fill:#141414}
.tm{font-family:Consolas,'Courier New',monospace;font-size:12.8px;fill:#141414}
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,1.4 L10,5 L0,8.6 z" fill="#141414"/>
</marker>
</defs>

<line class="ax" x1="60" y1="56" x2="766" y2="56" marker-end="url(#ar)"/>
<text class="ts" x="60" y="44">低地址</text>
<text class="ts" x="762" y="44" text-anchor="end">高地址</text>

<rect class="bx" x="60" y="76" width="130" height="68"/>
<text class="tn" x="125" y="104" text-anchor="middle">代码段</text>
<text class="ts" x="125" y="126" text-anchor="middle">机器指令</text>

<rect class="bx" x="190" y="76" width="130" height="68"/>
<text class="tn" x="255" y="104" text-anchor="middle">数据段</text>
<text class="ts" x="255" y="126" text-anchor="middle">已初始化的全局变量</text>

<rect class="bx" x="320" y="76" width="130" height="68"/>
<text class="tn" x="385" y="102" text-anchor="middle">BSS</text>
<text class="ts" x="385" y="124" text-anchor="middle">未初始化的全局变量</text>
<text class="ts" x="385" y="140" text-anchor="middle">加载时整块清零</text>

<rect class="bx" x="450" y="76" width="150" height="68"/>
<text class="tn" x="525" y="104" text-anchor="middle">堆 heap</text>
<text class="ts" x="525" y="126" text-anchor="middle">malloc 出来的内存</text>

<rect class="bx" x="600" y="76" width="160" height="68"/>
<text class="tn" x="680" y="104" text-anchor="middle">栈 stack</text>
<text class="ts" x="680" y="126" text-anchor="middle">局部变量与返回地址</text>

<line class="ax" x1="456" y1="166" x2="596" y2="166" marker-end="url(#ar)"/>
<text class="ts" x="526" y="186" text-anchor="middle">分配时往上长</text>

<line class="ax" x1="754" y1="166" x2="606" y2="166" marker-end="url(#ar)"/>
<text class="ts" x="680" y="186" text-anchor="middle">进入函数时往下退</text>

<path class="gd" d="M600,200 V210 H760 V200"/>
<text class="ts" x="680" y="228" text-anchor="middle">默认 1 MB（Windows）/ 8 MB（Linux）</text>
<text class="ts" x="680" y="246" text-anchor="middle">4 MB 的局部数组进不来</text>

<rect class="gd" x="60" y="266" width="700" height="64"/>
<text class="ts" x="76" y="290">这是一张逻辑示意，用来记各区的职责，不代表真实地址顺序。</text>
<text class="ts" x="76" y="312">在 Windows 上实测，堆的地址常常比栈还高；数字每台机器都不同，但各区相距很远这一点不变。</text>
</svg>
